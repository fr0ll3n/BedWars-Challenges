# BedWars Challenges rewards
# Edit this file to customize the reward for EVERY challenge.
# After editing run: /challenge reload
#
# Placeholders in commands and message:
#   {player}  {uuid}  {challenge}  {challenge_name}
#
# items format: MATERIAL:AMOUNT   example: DIAMOND:3
# commands run as console. Example: lp user {player} permission set rank.vip true

auto-permission: true
claim-item: GOLD_INGOT

