# BedWars2023-Challenges 2.3.2

# Full per-challenge rewards are in rewards.yml (created in the plugin folder).
# Edit rewards.yml then run /challenge reload.
# BedWars2023-Challenges 2.2.0
# Put this plugin on BOTH the lobby (BWProxy2023) and every arena (BedWars2023) server.
# Use the same MySQL database on every server so selected challenges follow the player.

debug: false

# Shared storage for lobby + arena servers.
# YAML is local to each server (fine for single-server / multi-arena).
# Enable MySQL when you run a proxy lobby and separate arena servers.
database:
  enabled: false
  host: localhost
  port: 3306
  name: bedwars
  username: root
  password: password
  ssl: false
  table-prefix: bwchallenges_
  pool-size: 4
  # Extra JDBC params (leave empty unless you need them)
  params: "characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true"

challenge:
  selector:
    enabled: true
    # Bind this in your map-selector / lobby item addon:
    #   command: challenge menu
    # BedWars item handlers also registered: challenge, challenges, bwchallenges, bwchallenges-menu
    attach-command: "challenge menu"
    title: "Play Bed Wars"
    item:
      slot: 7
      material: IRON_SWORD
      name: "&aChallenges"
      lore:
        - "&7Looking for a new way to play"
        - "&7Bed Wars? Enhance your gameplay"
        - "&7with exciting challenges!"
        - ""
        - "&eClick to view challenges!"
  menu:
    size: 54
    title: "&8Bed Wars Challenges"
    item:
      color: "&a"
      category: "&bChallenge Rules:"
      intro:
        - "&cYou can disable Challenges from this"
        - "&cmenu using the redstone on this page."
      status:
        activated: "&eClick to Activate!"
        deactivated: "&cClick to Disable!"
      none:
        name: "NONE"
      locked:
        name: "&7&o????"
        lore: "&cChallenge Locked!"
      redstone:
        name: "Disable Active Challenge"
        state:
          active: "&eClick to Disable!"
          deactivate: "&cNo Active Challenge."
      information:
        name: "&aChallenge Information"
      close:
        name: "&cClose"
    # Hypixel-style Go Back (center arrow). Runs as the player (no leading /).
    go-back:
      material: ARROW
      name: "&aGo Back"
      lore: "&7To Play Bed Wars"
      # Default command when mode cannot be detected
      command: "bedwars"
      # Optional extra commands (always run after the primary, if set)
      commands: []
      # Per-mode commands used by Go Back after /challenge <mode>
      # /challenge solo        -> modes.solo
      # /challenge doubles     -> modes.doubles
      # /challenge 3v3v3v3     -> modes.triples
      # /challenge 4v4v4v4     -> modes.fours
      lore-solo: "&7To Play Solo"
      lore-doubles: "&7To Play Doubles"
      lore-triples: "&7To Play 3v3v3v3"
      lore-fours: "&7To Play 4v4v4v4"
      modes:
        solo: "bw join Solo"
        doubles: "bw join Doubles"
        triples: "bw join 3v3v3v3"
        fours: "bw join 4v4v4v4"
        3v3v3v3: "bw join 3v3v3v3"
        4v4v4v4: "bw join 4v4v4v4"
  messages:
    menu:
      activated: "&aActivated Challenge: &6{challenge}"
      deactivated: "&cDeactivated Challenge: &6{challenge}"
      arena-open: "&cYou can only open the menu in the lobby!"
      not-unlocked: "&cYou have not unlocked this challenge yet!"
      reward-claimed: "&aClaimed &6{challenge} &areward: &e{reward}"
      reward-already-claimed: "&cYou already claimed this reward."
      reward-not-completed: "&cComplete the challenge first!"
    arena-top:
      - "&a▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - "                                   &c&lCHALLENGE ACTIVE!"
    arena-bottom:
      - "&a▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    challenges:
      renegade:
        open_upgrade: "&cYou cannot use upgrades and traps during the &6Renegade &cchallenge"
      warmonger:
        buy_item: "&cYou cannot purchase this item during this challenge"
      selfish:
        open_chests: "&cThis chest is locked during the &6Selfish &cchallenge"
        drop_item: "&cYou cannot drop anything during the &6Selfish &cchallenge"

  rewards:
    # First challenge is always unlocked. Completing one unlocks the next one only.
    auto-permission: true
    claim-item: GOLD_INGOT
    # Per-challenge rewards. permissions are given by this plugin (and re-applied on join).
    # commands run as console. Placeholders: {player} {uuid} {challenge} {challenge_name}
