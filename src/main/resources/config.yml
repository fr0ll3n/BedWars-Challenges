# ---------------------------------------------------------------------------
# Sounds (1.8 names work: NOTE_PLING, NOTE_BASS, ORB_PICKUP, LEVEL_UP, ...)
# volume: 0.0 – 1.0+
# pitch: 100 = normal (1.0). Use 50 for lower, 150 for higher. Or use 0.5–2.0 directly.
# Set sound: none to disable a sound.
# ---------------------------------------------------------------------------
sounds:
  click:
    sound: NOTE_PLING
    volume: 1
    pitch: 100
  activate:
    sound: LEVEL_UP
    volume: 1
    pitch: 120
  deactivate:
    sound: NOTE_BASS
    volume: 1
    pitch: 80
  deny:
    sound: VILLAGER_NO
    volume: 1
    pitch: 100
  complete:
    sound: LEVEL_UP
    volume: 1
    pitch: 100
  fail:
    sound: WITHER_HURT
    volume: 1
    pitch: 80
  page:
    sound: NOTE_PLING
    volume: 0.7
    pitch: 140
  reward:
    sound: ORB_PICKUP
    volume: 1
    pitch: 120
  red-light:
    sound: NOTE_PLING
    volume: 1
    pitch: 60
  green-light:
    sound: NOTE_PLING
    volume: 1
    pitch: 150
